<!-- File: EyeOffRedSlash.svg -->
<!-- Purpose: Transparent OFF eye for Highlights and Map Borders. White eye with a red slash. -->
<!-- Sized 38x38 to match EyeOnTransparent.svg. No built-in button backdrop. -->
<svg xmlns="http://www.w3.org/2000/svg"
     width="38"
     height="38"
     viewBox="0 0 38 38"
     role="img"
     aria-label="Highlights off">

  <g fill="none"
     stroke="#FFFFFF"
     stroke-width="3"
     stroke-linecap="round"
     stroke-linejoin="round">

    <path d="M4.4 19Q19 0 33.6 19Q19 38 4.4 19Z"/>
    <circle cx="19" cy="19" r="4.6"/>

  </g>

  <path d="M6.4 6.4 31.6 31.6"
        fill="none"
        stroke="#F55A5A"
        stroke-width="3.4"
        stroke-linecap="round"/>

</svg>
